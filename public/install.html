<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installing Stremio BDIX Addon…</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; text-align: center; }
a { display: inline-block; margin-top: 1rem; padding: .7rem 1.1rem; background: #6648ff; color: #fff; border-radius: .5rem; text-decoration: none; }
code { word-break: break-all; }
</style>
</head>
<body>
<h1>Installing Stremio BDIX Addon…</h1>
<p>If Stremio did not open automatically, tap the button below.</p>
<a id="open">Open in Stremio</a>
<p>Or paste this in <strong>Stremio → Addons → Add addon URL</strong>:</p>
<code id="manifest"></code>
<script>
(function () {
    var manifest = location.protocol + '//' + location.host + '/manifest.json';
    var deepLink = 'stremio://' + location.host + '/manifest.json';
    document.getElementById('manifest').textContent = manifest;
    document.getElementById('open').href = deepLink;
    // Custom schemes cannot be opened from all browsers without a user gesture,
    // but most mobile browsers allow this navigation on page load.
    location.replace(deepLink);
}());
</script>
</body>
</html>
